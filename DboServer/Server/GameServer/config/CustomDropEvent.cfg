# CustomDropEvent configuration
# Formats:
# mobTblidx: itemTblidx@rate, itemTblidx@rate, ...
# mobTblidx modifiers: hp=1.5 physAtk=1.2 engAtk=1.0 physDef=1.1 engDef=1.0 atkSpd=1.1 runSpd=1.2 attackRate=1.1 dodgeRate=1.1 blockRate=1.1 blockDmg=1.0 guardRate=1.0 physCrit=1.1 engCrit=1.1 physCritDmg=1.0 engCritDmg=1.0 sizeRate=14
# mobTblidx spawn: mobTblidx@ratexcount, mobTblidx@ratexcount, ...
#   - Example: 46661101 spawn: 16454101@50x2, 16454102@25  (50% chance spawn 2 of 16454101, 25% chance spawn 1 of 16454102)
# - rate is float percent (0..100). If omitted, 100 is used.
# Comments start with '#'
# Example entries:
16454101: 11160029@100
16454102: 11160029@50, 11160030@25
16454102 modifiers: hp=2.0 physAtk=1.3 physDef=1.2 runSpd=1.15 atkSpd=0.9 physCrit=1.2 engCrit=1.2

