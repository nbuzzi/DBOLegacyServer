# ---------------------------------------------------------------------------
# MobBuffs.cfg – sample configuration for CMobBuffsManager
# ---------------------------------------------------------------------------
# Copy this file to .\\config\\MobBuffs.cfg under the server runtime (ExecutionEnv)
# when you want these examples to be active. Feel free to duplicate / adjust
# the blocks below with real skill table indices, durations, and world IDs.
# ---------------------------------------------------------------------------

settings: Enabled=1 Verbose=1
# Enabled - turns the manager on/off without needing a rebuild
# Verbose  - prints a log entry every time a buff gets applied (useful for QA)

# ---------------------------------------------------------------------------
# Global defaults (commented out). Uncomment to give every mob an aura buff.
# ---------------------------------------------------------------------------
# all all buffs: 700101@600000   # Example: +Attack aura for 10 minutes
# all all buffs: 700202@0        # Example: Speed buff using the skill's default duration

# ---------------------------------------------------------------------------
# Mahoraga / Raviel / Despojo – sample buffs applied everywhere they spawn.
# Replace the skill IDs with the actual buffs you want to use.
# ---------------------------------------------------------------------------
all mob=68131410 buffs: 700101@180000, 700202@300000   # Mahoraga: +ATK, +Move SPD
all mob=68131411 buffs: 700101@180000, 700303@300000   # Raviel: +ATK, +Crit Rate
all mob=68131412 buffs: 700404@180000, 700505@300000   # Despojo: +DEF, +HP Regen

# ---------------------------------------------------------------------------
# Example: Only buff them inside a specific dungeon/world.
# Replace 8600400 with the actual worldTblidx for the instance you care about.
# ---------------------------------------------------------------------------
# world=8600400 mob=68131410 buffs: 700606@600000        # Mahoraga extra buff in world 8600400
# world=8600400 mob=68131411 buffs: 700707@600000        # Raviel extra buff in world 8600400
# world=8600400 mob=68131412 buffs: 700808@600000        # Despojo extra buff in world 8600400

# ---------------------------------------------------------------------------
# World-global rule with per-world exceptions (demo).
# Here we buff every mob in world 8600400, except Mahoraga & Raviel.
# ---------------------------------------------------------------------------
# all buffs except: world=8600400 mob=68131410,68131411
# world=8600400 all buffs: 700909@120000

# ---------------------------------------------------------------------------
# Reminder: To disable all buffs temporarily, set Enabled=0 in the settings
# line above or rename/remove the config file from the runtime config folder.
# ---------------------------------------------------------------------------
