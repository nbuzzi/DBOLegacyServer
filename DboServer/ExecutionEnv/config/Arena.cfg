[Arena]
Enabled = 1
; Comma-separated world tblidx ids to rotate between
WorldTblidxList = 13000, 510000, 800000
; Seconds before rotating to the next world (0 = no auto-rotation)
RoundTimerSeconds = 180
; When timer reaches zero, finish the current match automatically (1=yes,0=no)
StopOnTimeout = 1
; Instantly revive fainted participants with full LP/EP (1=yes,0=no)
ReviveOnFaint = 0
; If not reviving, move fainted participants to spectators (1=yes,0=no)
FaintBecomeSpectator = 1
; Notice display type to use for arena messages (0-6); 3 is common
NoticeType = 3
PostFinishTeleport = 1
PostFinishWorldTblidx = 1
TelecastEnabled = 1
RankUiEnabled = 1
InviteWaitSeconds = 15
MaxWaitAllArriveSeconds = 30
RankSequenceStepMs = 5000
StartDelaySeconds = 10
CCBattleMode=1          # Enable RankBattle-style combat
AllowCustomWorlds=0     # Allow GM commands and config to override worlds (0=RankBattle table only, 1=allow overrides)
UseInviteFlow=1         # Use teleport proposals  
InviteWaitSeconds=15    # Time to accept invitation
RotationSeconds=300     # 5 minutes per map rotation
RandomizeMapOnStart = 1
RoundsCount = 3
RoundTimerSeconds = 90
MapPerRound = 1


[Spectator]
; Allow spectators to watch matches
Enabled = 1
; If 1, spectators share the same world (separate coords). If 0, they go to SpectatorWorldTblidx below
UseSameWorld = 1
; Used only when UseSameWorld=0
WorldTblidx = 0
; Spectator spawn position (used in both modes)
PosX = 0.0
PosY = 0.0
PosZ = 0.0

[Rewards]
Enabled = 1
; CSV of itemId or itemId:count for winners
Winners = 12345:1, 67890:5
; Rewards for all participants
Participants = 80001:3
