[Arena]
Enabled = 1
; Comma-separated world tblidx ids to rotate between
; Recommended safe defaults based on your list (Battle_* maps are instanced and clean for PvP)
WorldTblidxList = 12000, 13000, 43000, 44000, 45000, 46000
; Worlds that should use Budokai-style packets (defaults to 30000,41000 if omitted)
; If you want to run on Budokai arenas as well, enable AllowBudokaiRuleWorlds below
; and keep this list populated with the Budokai worlds you have.
BudokaiWorldTblidxList = 30000, 31000, 32000, 40000, 41000, 42000
; Seconds before rotating to the next world (0 = no auto-rotation)
RotationSeconds = 300
; Round duration in seconds (overrides RankBattle table stage run time when > 0)
RoundTimerSeconds = 90
; When timer reaches zero, finish the current match automatically (1=yes,0=no)
StopOnTimeout = 1
; Number of rounds per match (overrides RankBattle table when > 0)
RoundsCount = 3
; Start delay before evaluating arrivals (prevents post-TP freezes)
StartDelaySeconds = 10
; Extra grace to wait for all accepted players to arrive
MaxWaitAllArriveSeconds = 30
; Show RankBattle HUD/packets. Keep both enabled for CCBattleMode
RankUiEnabled = 1
RankPacketsEnabled = 1
; Use RankBattle-style flow and maps
CCBattleMode = 1
; Allow worlds from this config (in addition to RankBattle table when UseOnlyCustomWorlds=0)
AllowCustomWorlds = 1
; Use only the list above and ignore RankBattle table worlds
UseOnlyCustomWorlds = 1
; Exclude Budokai-rule worlds from rotation unless explicitly allowed
AllowBudokaiRuleWorlds = 0  ; set to 1 if you want to use Budokai_* maps listed above
; Use teleport proposals (invite) instead of instant TP
UseInviteFlow = 1
InviteWaitSeconds = 15
; Randomize first map on arena start
RandomizeMapOnStart = 1
; Change map every round (1=yes,0=no)
MapPerRound = 1
; Verbose logging for troubleshooting
VerboseLogs = 1
; Telecast banner during start/finish
TelecastEnabled = 1
; Post-finish teleport everyone out to this world (set to 0 to disable)
PostFinishTeleport = 1
PostFinishWorldTblidx = 0
PostFinishPosX = 4975.609863
PostFinishPosY = -48.869999
PostFinishPosZ = 4012.609863
; Optional facing direction at destination
PostFinishDirX = 0.911100
PostFinishDirY = -0.412000
PostFinishDirZ = 0.0
; Keep Rank UI visible after finish (avoid sending LEAVE until after teleport)
KeepRankUiAfterFinish = 1
; Fainting behavior (keep 0 for RankBattle-like rounds)
ReviveOnFaint = 0
FaintBecomeSpectator = 1
; Notice display type to use for arena messages (0-6); 3 is common
NoticeType = 3


[Spectator]
; Allow spectators to watch matches
Enabled = 1
; If 1, spectators share the same world (separate coords). If 0, they go to SpectatorWorldTblidx below
UseSameWorld = 1
; Used only when UseSameWorld=0
WorldTblidx = 0
; Spectator spawn position (used in both modes)
PosX = 0.0
PosY = 0.0
PosZ = 0.0

[Rewards]
Enabled = 1
; CSV of itemId or itemId:count for winners (using valid Dragon Ball item IDs)
Winners = 40003:1
; Rewards for all participants (using valid Dragon Ball item IDs)  
Participants = 40003:1
