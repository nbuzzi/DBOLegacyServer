# Virtual Transformation System Configuration
# Allows creating custom transformations with model swapping
# Transform IDs must be 100 or higher

# ============================================================================
# EXAMPLE: Test Transform - Human to Namek
# ============================================================================
[Transform_200]
Name=Test: Human to Namek
# Base transformation slot to use (client will see this aura/animation)
BaseAspect=ASPECTSTATE_KAIOKEN

# Stat multipliers (1.0 = no change)
HPMultiplier=5.0
PhysAtkMultiplier=5.0
EngAtkMultiplier=5.0
PhysDefMultiplier=3.0
EngDefMultiplier=3.0
AtkSpdMultiplier=1.5
RunSpdMultiplier=2.0
PhysCritMultiplier=2.0
EngCritMultiplier=2.0

# Model Override (enables model swapping)
EnableModelSwap=1
TargetRace=RACE_NAMEK
TargetGender=GENDER_MALE
TargetFace=0
TargetHair=0
TargetHairColor=0
TargetSkinColor=2

# ============================================================================
# EXAMPLE: Test Transform - Human to Majin
# ============================================================================
[Transform_201]
Name=Test: Human to Majin
BaseAspect=ASPECTSTATE_SUPER_SAIYAN

HPMultiplier=6.0
PhysAtkMultiplier=4.0
EngAtkMultiplier=4.0
PhysDefMultiplier=4.0
EngDefMultiplier=4.0
AtkSpdMultiplier=1.3
RunSpdMultiplier=1.8
PhysCritMultiplier=1.5
EngCritMultiplier=1.5

EnableModelSwap=1
TargetRace=RACE_MAJIN
TargetGender=GENDER_MALE
TargetFace=0
TargetHair=0
TargetHairColor=0
TargetSkinColor=0

# ============================================================================
# TEMPLATE: Super Saiyan Blue (without model swap)
# ============================================================================
[Transform_100]
Name=Super Saiyan Blue
BaseAspect=ASPECTSTATE_KAIOKEN

HPMultiplier=3.5
PhysAtkMultiplier=4.0
EngAtkMultiplier=4.0
PhysDefMultiplier=2.5
EngDefMultiplier=2.5
AtkSpdMultiplier=1.8
RunSpdMultiplier=2.5
PhysCritMultiplier=3.0
EngCritMultiplier=3.0

# No model swap - just uses Kaioken slot with blue textures from .pak
EnableModelSwap=0

# ============================================================================
# TEMPLATE: Ultra Instinct (without model swap)
