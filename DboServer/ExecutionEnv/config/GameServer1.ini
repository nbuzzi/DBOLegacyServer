[HELPER_NPC]
; Enable or disable helper NPC spawning in underfilled parties when entering dungeons
Enable = 1
; Control per-dungeon-type allowance
AllowUltimate = 1
AllowBattleDungeon = 1
AllowTimeQuest = 1
UseMobAsHelper = 1
MobId = 25734101
; Spawn only if current party size is less than this number
MinPartySizeToAvoid = 5
; Preferred healer NPC IDs (falling back if primary not found)
PrimaryNpcId = 0
FallbackNpcId = 0
; Offset (meters) from leader when spawning
SpawnOffset = 2.0
; Whether the helper should follow the party leader
FollowLeader = 1
; Whether the helper should attack the leader's current target
AssistLeaderTarget = 1
; Multiplies helper NPC physical/energy offense (1.0 = default, 2.0 = double damage, etc.)
DamageMultiplier = 50.0
; Multiplies helper NPC healing (direct + over-time). 1.0 = no change
HealPowerMultiplier = 10.0
; Adds attack speed percent to helper NPC (0 = none, 20 = +20% attack speed)
AttackSpeedPercent = 50
; Forced heal skill to inject (party/ally heal) — 3131102 per request
ForcedSkillTblidx=3131102,1620044,2020045,1520063
ForcedSkillBasis=4
ForcedSkillLP=70
ForcedSkillTime=5
; ealLpThresholdOverride semantics:
; >0 = use that % threshold; 0 = heal anyone missing LP, even out of combat (party-wide)
HealLpThresholdOverride=0
; When override=0, only prioritize healing if leader is missing at least this % LP
HealPriorityMinMissingPercent=8
; Multiplies helper NPC movement speeds (1.0 = default, 1.5 = +50% speed, etc.)
MoveSpeedMultiplier=50.0
EpRegenPercent=1000
InvincibleHelper=1
; Optional list of extra buffs/heals to add to the helper
; Example includes 420141 as requested; add more comma-separated if desired
BuffSkills=0
BuffBasis=5
BuffLP=0
BuffTime=10
; Proactive attack: scan and engage nearby mobs when idle (healing still takes priority)
ProactiveAutoAttack=1
AttackScanRange=20
AttackScanCooldownMs=100
HealUseRangeBonusMeters=1000.0
HealApplyAreaBonusMeters=1000.0
ExtraUDWorldIDs=920000
; Modifiers
MaxLPPercent=500
MaxEPPercent=500
PhysicalOffensePercent=200
EnergyOffensePercent=200
PhysicalDefensePercent=150
EnergyDefensePercent=150
AttackRangePercent=250
AttackRangeBonusMeters=30.0
SkillAnimSpeedPercent=50
; Explicitly disable global tank aggro enforcement (now default off in code). Enable only per-role.
EnforceTankAggro=0
; Resurrection retry/backoff now tunable:
; ResurrectMaxAttempts=3            ; total attempts including first immediate
; ResurrectRetryDelay1Ms=1200       ; delay before 2nd attempt
; ResurrectRetryDelay2Ms=2500       ; delay before 3rd attempt
; Buff burst limits (increase after a wipe to speed restoration):
; MaxBuffsPerAudit=1                ; total buffs allowed to queue per audit cycle
; MaxBuffsPerTargetPerAudit=1       ; per-target cap within a single cycle
; (Uncomment to override defaults)
ResurrectMaxAttempts=50
ResurrectRetryDelay1Ms=500
ResurrectRetryDelay2Ms=1000
MaxBuffsPerAudit=15
MaxBuffsPerTargetPerAudit=10
; Admin / duplication controls
AllowGMHelpers=1                       ; prevent helpers spawning for GM when teleporting
AllowMultipleHelpersPerWorld=0         ; 0 = only one total helper in a world instance
DisallowDuplicateHelperKindPerWorld=0  ; prevent spawning another helper with the same tblidx (NPC or MOB) in the same world
BuffPartyWide = 1
BuffApplyAreaMeters = 60.0
; Rebuff controller (enable periodic audit so multiple buffs are applied)
RebuffCooldownMs = 2000
RebuffMinRemainingMs = 3000


