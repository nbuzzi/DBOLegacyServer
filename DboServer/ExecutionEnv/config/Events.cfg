[Event]
; Enable/disable event system
Enabled = 1

; Only run events on channels whose name contains this substring (case-insensitive)
ChannelNameContains = EVENTS

; World tblidx to use for events
EventWorldTblidx = 2

; Spawn position for event (center point for mob spawning)
; Set to 0,0,0 to use world table default spawn position (recommended)
; Or specify custom coordinates to override
SpawnPosX = 0.0
SpawnPosY = 0.0
SpawnPosZ = 0.0

; Max tick count per event instance (0 = unlimited)
MaxTickCount = 0

; Tick interval in milliseconds
TickIntervalMs = 1000

; Enrollment duration in seconds
EnrollmentSeconds = 300

; Require @participate command to join (1=yes, 0=auto-join allowed)
RequireParticipateCommand = 1

; Delay before starting first round after teleport (seconds)
StartDelaySeconds = 10

; Teleport position for participants when event starts
; Set to 0,0,0 to use world table default spawn position (recommended)
; Or specify custom coordinates to override
TeleportPosX = 0.0
TeleportPosY = 0.0
TeleportPosZ = 0.0

; Post-event teleport settings
PostEventTeleport = 1
PostEventWorldTblidx = 1
PostEventPosX = 4975.609863
PostEventPosY = -48.869999
PostEventPosZ = 4012.609863
PostEventTeleportDelayMs = 3000

; Mudosa rewards
MudosaPerRound = 1000
MudosaEventComplete = 5000

; Mob spawn configuration
MobSpawnRadius = 50.0
RandomMobPositions = 1

; Spectators
SpectatorsEnabled = 0

; Verbose logging
VerboseLogs = 1

; Rounds configuration
; Format: "mobs:reward_type:param1:param2:duration:worldId:minions;..."
;
; For fixed rewards:
;   "mob1,mob2:itemId:count:0:duration:worldId:minion1,minion2|radius|count"
;
; For loot range (like @createloot):
;   "mob1,mob2:RANGE:itemId:count:duration:worldId:minion1,minion2|radius|count"
;
; Minion format (optional): "minionId1,minionId2|radius|totalCount"
;   - minionIds: Comma-separated list of minion mob IDs to spawn around EACH boss
;   - radius: Spawn radius around boss in meters (default 15.0)
;   - totalCount: Total minions to spawn per boss (0 = one of each type)
;
; worldId is optional - if 0 or omitted, uses WorldRotation list
; minions is optional - if omitted, no minions spawn
;
; Simple example without minions:
Rounds = 3411,3412:11120220:2:0:180:1;3413,3414,3415:RANGE:19916:10:240:500;3416:11120093:5:0:300:13000
;
; Example WITH minions:
; Round 1: Boss 3416 + 5 minions (mix of 3411,3412) within 15m radius
; Round 2: Boss 3420 + 8 minions (mix of 3415,3416,3417) within 20m radius
; Rounds = 3416:11120093:5:0:300:13000:3411,3412|15|5;3420:RANGE:19916:10:240:500:3415,3416,3417|20|8

[AutoEvent]
; Enable automatic event scheduling
Enabled = 1

; How often to start a new event (seconds)
IntervalSeconds = 1800

; Initial delay before first auto-event after server starts (seconds)
InitialDelaySeconds = 0

; Automatically restart event after completion (infinite loop mode)
; When enabled, event will restart after RestartDelaySeconds once completed
RestartOnComplete = 1

; Delay before restarting after event completes (seconds)
RestartDelaySeconds = 300

[Engagement]
; Player engagement features to make events more exciting

; Show damage leaderboard and award MVP bonuses
EnableLeaderboard = 1
; Bonus mudosa for top 3 players (1st: 100%, 2nd: 70%, 3rd: 50%)
MVPBonusMudosa = 2000

; Announce when players kill mobs
EnableKillAnnouncements = 1

; Combo kill bonuses (kill multiple mobs quickly)
EnableComboBonus = 1
; Time in seconds to maintain combo (default: 10)
ComboTimeoutSeconds = 10
; Mudosa multiplier per combo level (default: 1.5x base reward)
ComboMultiplier = 1.5

; Scale mob count based on number of participants
EnableDynamicDifficulty = 1
; Additional difficulty per player: 0.3 = +30% mobs per extra player
DifficultyPerPlayer = 0.3

; Time-based bonus rewards for fast completion
EnableTimeAttack = 1
TimeAttackGoldSeconds = 120
TimeAttackSilverSeconds = 180
TimeAttackBronzeSeconds = 240
; Bonus mudosa for time attack tiers (Gold: 100%, Silver: 70%, Bronze: 50%)
TimeAttackBonusMudosa = 1000

; Bonus rewards for party members
EnablePartyBonus = 1
; Multiplier: 1.2 = +20% rewards for party members
PartyBonusMultiplier = 1.2

; Team Competition Mode (Red vs Blue)
; When enabled, participants are split into two competing teams
; Teams compete for highest total damage/kills
; Winning team gets bonus rewards
EnableTeamCompetition = 0
; Bonus mudosa for winning team members (default: 3000)
TeamCompetitionBonusMudosa = 3000

[WorldRotation]
; Enable world rotation per round
; When enabled, each round will rotate through WorldList (unless round specifies its own world)
Enabled = 1

; Comma-separated list of world tblidx to rotate through
; Format: "world1,world2,world3"
; Each round will use the next world in the list (or random if RandomizeWorlds=1)
WorldList = 1,500,13000,43000

; Pick random world from list for each round (1=random, 0=sequential)
RandomizeWorlds = 1
