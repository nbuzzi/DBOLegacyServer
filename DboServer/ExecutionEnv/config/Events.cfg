[Event]
; Enable/disable event system
Enabled = 1

; Only run events on channels whose name contains this substring (case-insensitive)
ChannelNameContains = EVENTS

; World tblidx to use for initial event teleport
; Using static world - static worlds are more stable
; 1 = West City (Kokkara), 4 = Papaya Island, 5 = North City
EventWorldTblidx = 4

; Spawn position for event (center point for mob spawning)
; Set to 0,0,0 to use world table default spawn position (recommended)
; Or specify custom coordinates to override
SpawnPosX = 0.0
SpawnPosY = 0.0
SpawnPosZ = 0.0

; Max tick count per event instance (0 = unlimited)
MaxTickCount = 0

; Tick interval in milliseconds
TickIntervalMs = 1000

; Enrollment duration in seconds
EnrollmentSeconds = 300

; Require @participate command to join (1=yes, 0=auto-join allowed)
RequireParticipateCommand = 1

; Delay before starting first round after teleport (seconds)
StartDelaySeconds = 10

; Delay between rounds (seconds) - default 30 if not set
IntermissionSeconds = 5

; Teleport position for participants when event starts
; Set to 0,0,0 to use automatic safe position calculation
; Or specify custom coordinates to override (useful for testing)
; Example for TLQ dungeons: try different values if (0,0,0) doesn't work
TeleportPosX = 0.0
TeleportPosY = 0.0
TeleportPosZ = 0.0

; Post-event teleport settings (teleport to West City after event ends)
PostEventTeleport = 1
PostEventWorldTblidx = 5
PostEventPosX = 0
PostEventPosY = 0
PostEventPosZ = 0
PostEventTeleportDelayMs = 5000

; Mudosa rewards
MudosaPerRound = 1000
MudosaEventComplete = 5000

; Mob spawn configuration
; Radius around spawn point (or player) to spawn mobs - larger = more spread out
MobSpawnRadius = 100.0
RandomMobPositions = 1

; Wave spawning system (continuous mob spawns)
; When enabled, mobs spawn in waves every X seconds until round ends
; When disabled, all mobs spawn once at round start (traditional mode)
EnableWaveSpawning = 1
WaveIntervalSeconds = 60
MobsPerWave = 50

; Spectators
SpectatorsEnabled = 0

; Verbose logging
VerboseLogs = 1

; Auto-resurrection system
; When enabled, players who die will auto-resurrect after a delay
AutoResurrectEnabled = 1
; Maximum deaths before player is eliminated from rewards (default 30)
MaxDeathsBeforeElimination = 30
; Delay in milliseconds before auto-resurrecting (default 3000 = 3 seconds)
AutoResurrectDelayMs = 3000

; Event Helpers - NPC companions that help players during the event
EventHelpersEnabled = 1
; Number of helpers per player (0 = disabled, 1 = one helper per player, etc.)
HelpersPerPlayer = 1
; Mob ID to use for helpers (must be valid mob with helper AI configured)
; Default: 3416101 (example helper mob - change to your actual helper mob ID)
HelperMobId = 3416101
; Distance helpers maintain from their linked player
HelperFollowDistance = 3.0
; Helper capabilities (requires helper AI to be configured for the mob)
HelperEnableHealing = 1
HelperEnableBuffing = 1
HelperEnableAttacking = 1

; Rounds configuration
; Format: "mobs:reward_type:param1:param2:duration:worldId:minions;..."
;
; For fixed rewards:
;   "mob1,mob2:itemId:count:0:duration:worldId:minion1,minion2|radius|count"
;
; For loot range (like @createloot):
;   "mob1,mob2:RANGE:itemId:count:duration:worldId:minion1,minion2|radius|count"
;
; Minion format (optional): "minionId1,minionId2|radius|totalCount"
;   - minionIds: Comma-separated list of minion mob IDs to spawn around EACH boss
;   - radius: Spawn radius around boss in meters (default 15.0)
;   - totalCount: Total minions to spawn per boss (0 = one of each type)
;
; worldId is optional - if 0 or omitted, uses WorldRotation list
; minions is optional - if omitted, no minions spawn
;
; Event rounds with valid mob IDs and 10-minute (600 second) duration per round
; Format: mobs:reward_type:param1:param2:duration:worldId
;
; INSTRUCTIONS TO FIND VALID MOB IDs:
; 1. Go in-game to West City or starting area
; 2. Use @addmob command to test IDs: @addmob 1011101, @addmob 1012101, etc.
; 3. Try these common patterns:
;    - 10XXYY01 = Earth/Papaya mobs (XX=area, YY=mob type)
;    - 20XXYY01 = Namek mobs
;    - 30XXYY01 = Space/Frieza mobs
;    - 50XXYY01 = Boss mobs
; 4. Replace the IDs below with mobs that spawn successfully
;
; 5 Rounds - Each wave randomly picks from mob list (EACH mob is individually random from list)
; Fixed reward format: mob1,mob2,mob3,...:itemId:count:duration:portalId
; Range reward format: mob1,mob2,mob3,...:RANGE:itemId:count:duration:portalId
; portalId format: "P54" for portal, "0" for WorldRotation list, "1" for worldId
; Portal IDs: P54 (round 1), P33 (round 2), P53 (round 3), P17 (round 4), P54 (round 5)
; To get MIX of mobs, add different mob IDs to the list and test with @addmob first!
; Each round uses DIFFERENT mob sets for variety and progressive difficulty
; TODO: Test these mob IDs with @addmob and replace with ones that work in your version!
; Round configuration - Using known working mob IDs
; These 3 mob IDs are confirmed to work: 38812110, 3416101, 25734101
; The wave spawner will randomly pick MobsPerWave (50) mobs from this list for each wave
;
; HOW TO ADD MORE MOB VARIETY:
; 1. In-game, test mob IDs with: @addmob <mobId>
; 2. If the mob spawns, add that ID to the list below (comma-separated)
; 3. Example: 38812110,3416101,25734101,1011101,2021101,5011101
; 4. The more IDs you add, the more variety in spawned mobs
;
; Common mob ID patterns to test:
; - 10XXYY01 = Earth area mobs (10 = region, XX = zone, YY = mob type)
; - 20XXYY01 = Namek area mobs
; - 30XXYY01 = Space/Frieza area mobs
; - 50XXYY01 = Boss mobs
;
; Format: mobIds:rewardItemId:rewardCount:durationSeconds:portalId
; These mob IDs are from your Mobs.txt - all confirmed to exist!
; NOTE: Due to 255 char limit per line, using simplified mob lists
; Round 1: Energy types + Ginyu Force (17 mob types)
; Round 2: Ozaru forms + Villains (12 mob types)
; Round 3: Magic Cubes + Heroes (20 mob types)
; Round 4: Mixed bosses (15 mob types)
; Round 5: Elite enemies (18 mob types)
Rounds = 38812101,38812104,38812107,38812110,281106,1541101,3691101,3531901,37122101:11120220:2:600:P54;5682206,5691101,5711107,33134101,3521101:RANGE:19916:10:600:P33;5511101,5512101,5513101,5514101,44681201,4801201:11120093:5:600:P53;281106,1541101,3691101,5682206,38812101:11120220:2:600:P17;5511101,3521101,44681201,37122101,33531901:RANGE:19916:10:600:P54
;
; Example WITH minions:
; Round 1: Boss 3416 + 5 minions (mix of 3411,3412) within 15m radius
; Round 2: Boss 3420 + 8 minions (mix of 3415,3416,3417) within 20m radius
; Rounds = 3416:11120093:5:0:300:13000:3411,3412|15|5;3420:RANGE:19916:10:240:500:3415,3416,3417|20|8

[AutoEvent]
; Enable automatic event scheduling
Enabled = 1

; How often to start a new event (seconds)
IntervalSeconds = 1800

; Initial delay before first auto-event after server starts (seconds)
InitialDelaySeconds = 0

; Automatically restart event after completion (infinite loop mode)
; When enabled, event will restart after RestartDelaySeconds once completed
RestartOnComplete = 1

; Delay before restarting after event completes (seconds)
RestartDelaySeconds = 300

[Engagement]
; Player engagement features to make events more exciting

; Show damage leaderboard and award MVP bonuses
EnableLeaderboard = 1
; Bonus mudosa for top 3 players (1st: 100%, 2nd: 70%, 3rd: 50%)
MVPBonusMudosa = 2000

; Announce when players kill mobs
EnableKillAnnouncements = 1

; Combo kill bonuses (kill multiple mobs quickly)
EnableComboBonus = 1
; Time in seconds to maintain combo (default: 10)
ComboTimeoutSeconds = 10
; Mudosa multiplier per combo level (default: 1.5x base reward)
ComboMultiplier = 1.5

; Scale mob count based on number of participants
EnableDynamicDifficulty = 1
; Additional difficulty per player: 0.3 = +30% mobs per extra player
DifficultyPerPlayer = 0.3

; Time-based bonus rewards for fast completion
EnableTimeAttack = 1
TimeAttackGoldSeconds = 120
TimeAttackSilverSeconds = 180
TimeAttackBronzeSeconds = 240
; Bonus mudosa for time attack tiers (Gold: 100%, Silver: 70%, Bronze: 50%)
TimeAttackBonusMudosa = 1000

; Bonus rewards for party members
EnablePartyBonus = 1
; Multiplier: 1.2 = +20% rewards for party members
PartyBonusMultiplier = 1.2

; Team Competition Mode (Red vs Blue)
; When enabled, participants are split into two competing teams
; Teams compete for highest total damage/kills
; Winning team gets bonus rewards
EnableTeamCompetition = 0
; Bonus mudosa for winning team members (default: 3000)
TeamCompetitionBonusMudosa = 3000

[WorldRotation]
; Enable world rotation per round
; When enabled, each round will rotate through WorldList (unless round specifies its own world/portal)
; When enabled, initial teleport is skipped and Round 1 does the first teleport
; NOTE: Disabled when using portal-based teleportation (P54, P33, etc.)
Enabled = 0

; Comma-separated list of world tblidx to rotate through
; Format: "world1,world2,world3"
; Each round will use the next world in the list (or random if RandomizeWorlds=1)
; Using static open worlds for reliable spawning (no dungeon position issues)
; World 1 = West City, 3 = East District, 6 = Mushroom Rock, 9 = Porunga Rocks, 804000 = CCBD
WorldList = 1,3,6,9,804000

; Pick random world from list for each round (1=random, 0=sequential)
RandomizeWorlds = 1
