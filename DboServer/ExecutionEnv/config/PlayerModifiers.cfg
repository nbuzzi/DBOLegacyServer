# AutoScheduleDaysPerWeek: How many times per week to run (1-7)
# AutoScheduleDurationHours: How long each session lasts (in hours)
# AutoScheduleIntervalHours: Minimum hours between sessions (default: 168/daysPerWeek for even distribution)
# AutoScheduleInitialDelayMinutes: Delay before first auto-run after server start (default: 30)
