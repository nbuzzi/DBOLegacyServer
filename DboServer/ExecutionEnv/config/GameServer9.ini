[BUDOKAI]
; Time before opening when dojo recommend notices run (seconds)
; Typical: 600 (10 minutes)
DojoRecommendTime = 160

; Time for general open notices prior to registration (seconds)
; Typical: 1200 (20 minutes)
OpenNoticeTime = 160

; Registration window length (seconds)
; Typical: 1800 (30 minutes)
RegisterTime = 160

; Delay after Budokai finishes before cleanup (seconds)
; Typical: 180 (3 minutes)
; EndingWaitTime = 1800

; Match wait/duration caps per phase (seconds)
; Used as the per-fight duration in Prelim/Major/Final phases
; Typical: 180/180/240
; MinorMatchWaitTime = 1800
; MajorMatchWaitTime  = 1800
; FinalMatchWaitTime  = 1800

; Extra end buffer after the tournament phases (seconds)
; Typical: 86400 (115 minutes)
BudokaiEndTime = 86400

; Score caps for match wins (best-of values)
; Defaults in code: Major=3, Final=4
MajorMatchMaxScore = 3
FinalMatchMaxScore = 4

; Team size for party Budokai (2 = 2v2, 3 = 3v3, 5 = 5v5)
; Default: 5 (full party)
TeamMaxMembers = 2

; Budokai Schedule Configuration
; Days of week: 0=Sunday, 1=Monday, 2=Tuesday, 3=Wednesday, 4=Thursday, 5=Friday, 6=Saturday
; Hours: 0-23 (24-hour format)
; To disable a slot, use 255 for the Wday value

; Adult Solo Budokai (up to 9 time slots)
; Default: Saturday 18:00 and Thursday 23:00
AdultSoloWday1 = 6
AdultSoloHour1 = 18
AdultSoloWday2 = 4
AdultSoloHour2 = 23
; Slot 3 (optional)
AdultSoloWday3 = 255
AdultSoloHour3 = 0
; Slot 4 (optional)
AdultSoloWday4 = 255
AdultSoloHour4 = 0
; Slot 5 (optional)
AdultSoloWday5 = 255
AdultSoloHour5 = 0
; Slot 6 (optional)
AdultSoloWday6 = 255
AdultSoloHour6 = 0
; Slot 7 (optional)
AdultSoloWday7 = 255
AdultSoloHour7 = 0
; Slot 8 (optional)
AdultSoloWday8 = 255
AdultSoloHour8 = 0
; Slot 9 (optional)
AdultSoloWday9 = 255
AdultSoloHour9 = 0

; Junior Solo Budokai
; Default: Tuesday 14:00
JuniorSoloWday = 2
JuniorSoloHour = 14

; Adult Party Budokai (up to 3 time slots)
; Default: Sunday 13:00
AdultPartyWday1 = 0
AdultPartyHour1 = 13
; Slot 2 (optional)
AdultPartyWday2 = 255
AdultPartyHour2 = 0
; Slot 3 (optional)
AdultPartyWday3 = 255
AdultPartyHour3 = 0

; Junior Party Budokai
; Default: Friday 17:00
JuniorPartyWday = 5
JuniorPartyHour = 17