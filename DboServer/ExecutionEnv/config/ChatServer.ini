[Translator]
; Enable DeepL-backed chat translation via prefixes:
;   $chinese <text>, $japanese <text>, $spanish <text>, $english <text>
; Prefix may be followed by a space or a colon, e.g. $italian: hello
; When enabled and a valid key is configured, messages are translated server-side
; before broadcasting, preserving original sender and channel.
; Supported prefixes (examples):
;   $english, $en, $english-us, $en-us, $english-uk, $en-gb
;   $spanish, $es | $japanese, $ja | $chinese, $zh | $korean, $ko
;   $french, $fr | $german, $de | $portuguese, $pt, $pt-br, $pt-pt
;   $italian, $it | $russian, $ru | $turkish, $tr | $polish, $pl
;   $dutch, $nl | $swedish, $sv | $norwegian, $no/$nb | $danish, $da
;   $finnish, $fi | $czech, $cs | $hungarian, $hu | $romanian, $ro
;   $bulgarian, $bg | $slovak, $sk | $slovenian, $sl | $estonian, $et
;   $latvian, $lv | $lithuanian, $lt | $ukrainian, $uk | $indonesian, $id | $greek, $el
Enable = 1
DeepLKey = fe44a049-c6db-4055-869f-d62c23fe27a1
; Use free endpoint (api-free.deepl.com) when set to 1; otherwise api.deepl.com
DeepLUseFreeApi = 0